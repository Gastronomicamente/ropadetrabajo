<!DOCTYPE html> <!-- Declara que este documento es de tipo HTML5 -->
<html lang="es"> <!-- Abre el documento HTML y define el idioma principal como español -->
  <head> <!-- Abre la sección de metadatos, configuración y enlaces -->
    <meta charset="UTF-8"> <!-- Configura la codificación para leer tildes y eñes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la escala a celulares y tablets -->
    <title>Gastronómicamente - Calzado Antideslizante</title> <!-- Título específico de esta sección -->
    <link rel="stylesheet" href="style7.css"> <!-- Sugerencia: podés unificar todos los CSS en un solo archivo -->
  </head>

  <body> <!-- Abre el cuerpo visible de la página web -->

    <!-- Contenedor principal que envuelve y centra visualmente toda la tarjeta -->
    <main class="contenedor-principal">

      <!-- Encabezado que agrupa el título de la marca y su subtítulo -->
      <header class="header-marca">
        <h1>GASTRONÓMICAMENTE</h1> <!-- Título principal de la marca (único H1 por página) -->
        <h2>Indumentaria de trabajo</h2> <!-- Subtítulo descriptivo de la marca -->
      </header>

      <!-- Separador visual decorativo -->
      <div class="separador" aria-hidden="true">
        <span>✧ ✄ ✧</span>
      </div>

      <!-- Sección semántica que agrupa la información del producto -->
      <section class="card-producto">
        <h3>CALZADO ANTIDESLIZANTE</h3> <!-- Título de sección -->

        <!-- Se eliminó el .contenedor-principal duplicado que estaba aquí adentro -->
        <div class="contenedor-imagenes-flex">

          <!-- Primer Bloque con etiquetas semánticas -->
          <figure class="bloque-imagen">
            <img src="Calzado-Antideslizante.jpg" alt="Zueco gastronómico antideslizante modelo 1">
            <figcaption class="autor">Public Image</figcaption>
          </figure>

          <!-- Segundo Bloque con etiquetas semánticas -->
          <figure class="bloque-imagen">
            <img src="Calzado-Antideslizante1.jpg" alt="Zapato de cocina antideslizante modelo 2">
            <figcaption class="autor">Public Image</figcaption>
          </figure>

        </div>

        <!-- Contenedor que agrupa los párrafos informativos -->
        <div class="info-detalles">

          <!-- Especificaciones adaptadas a calzado (números en lugar de letras) -->
          <p>
            <strong>Colores:</strong> Blanco / Negro.<br>
            <strong>Talles :</strong> desde el 35 al 45
          </p>

          <!-- Precios actualizados para calzado (ajustá los valores reales) -->
          <p class="precios-caja">
            Calzado con placa antideslizante: <span class="color-precio">$40.000.-</span><br>
          </p>
        </div>

        <!-- Contenedor de botones de navegación -->
        <nav class="contenedor-link" aria-label="Navegación entre categorías">
          <a href="remeras.html">◀ Volver a Remeras y Chombas</a>
          <a href="index.html" class="link-home">Página Principal</a>
        </nav>

      </section> <!-- Cierra la sección del producto -->

    </main> <!-- Cierra el contenedor principal -->

  </body>
</html>
