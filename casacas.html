<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastronómicamente - Casacas para Chef</title>
    <!-- Corregido: se quitó el doble .css -->
    <link rel="stylesheet" href="style3.css">
  </head>

  <body>
    <main class="contenedor-principal">

      <header class="header-marca">
        <h1>GASTRONÓMICAMENTE</h1>
        <h2>Indumentaria de trabajo</h2>
      </header>

      <div class="separador" aria-hidden="true">
        <span>✧ ✄ ✧</span>
      </div>

      <section class="card-producto">
        <h3>CASACAS PARA CHEF</h3>

        <div class="contenedor-imagen">
          <!-- Foto 1: ahora en su propio <figure> -->
          <figure class="item-foto">
            <h4>Casaca de Acrocel</h4>
            <img src="casacaschefacrocelb.jpg" alt="Casaca de Acrocel blanca para chef">
            <figcaption class="etiqueta-img">Public Image</figcaption>
          </figure>

          <!-- Foto 2: separada en su propio <figure> para alinear en fila -->
          <figure class="item-foto">
            <h4>Casaca de Acrocel</h4>
            <img src="casacaschefacroceln.jpg" alt="Casaca de Acrocel negra para chef">
            <figcaption class="etiqueta-img">Public Image</figcaption>
          </figure>

          <!-- Foto 3 -->
          <figure class="item-foto">
            <h4>Casaca de Gabardina</h4>
            <img src="casacaschefgabardinabn.jpg" alt="Casacas de Gabardina para chef">
            <figcaption class="etiqueta-img">Public Image</figcaption>
          </figure>
        </div>

        <div class="info-detalles">
          <p>
            <strong>Colores:</strong> Blanco / Negro.<br>
            <strong>Talles:</strong> S / M / L / XL / 2XL / 3XL / 4XL
          </p>

          <p class="precios-caja">
            Acrocel: <span class="color-precio">$44.000.-</span><br>
            Gabardina: <span class="color-precio">$38.000.-</span>
          </p>
        </div>

        <nav class="contenedor-link" aria-label="Navegación entre categorías">
          <a href="pantalones.html">◀ Volver a Pantalones</a>
          <a href="index.html" class="link-home">Página Principal</a>
          <a href="delantales.html">Ir a Delantales ▶</a>
        </nav>
      </section>

    </main>

</html>
